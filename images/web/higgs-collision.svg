<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="t d">
<title id="t">Animated Higgs boson production</title>
<desc id="d">Two protons collide head-on; a Higgs boson forms and decays into two photons, while two jets fly out close to the beam.</desc>
<style>
  .det { fill: none; stroke: #d6dbe3; stroke-width: 1.5; }
  .beam { stroke: #c3c9d3; stroke-width: 1.5; stroke-dasharray: 3 5; }
  .p { fill: #1a5fb4; }
  .lbl { font: 600 16px Inter, -apple-system, "Segoe UI", sans-serif; fill: #333; }
  .sm { font: 13px Inter, -apple-system, "Segoe UI", sans-serif; fill: #666; }
  .gam { fill: none; stroke: #c77c02; stroke-width: 2.2; stroke-linecap: round; }
  .trk { fill: none; stroke: #26a269; stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 100; animation-name: trk; animation-fill-mode: both; }
  .hit { fill: #26a269; animation-name: hit; animation-fill-mode: both; }
  .anim { animation-duration: 5s; animation-iteration-count: infinite; animation-timing-function: linear; }
  #pl { animation-name: pl; animation-timing-function: ease-in; }
  #pr { animation-name: pr; animation-timing-function: ease-in; }
  #flash { animation-name: flash; transform-origin: 300px 140px; }
  #higgs { animation-name: higgs; }
  .gam { stroke-dasharray: 100; animation-name: gam; }
  #jlbl { animation-name: jlbl; }
  #glbl { animation-name: fadeout; }
  @keyframes pl { 0% { transform: translateX(-270px); opacity: 1 } 20% { transform: translateX(-6px); opacity: 1 } 21%,100% { transform: translateX(-6px); opacity: 0 } }
  @keyframes pr { 0% { transform: translateX(270px); opacity: 1 } 20% { transform: translateX(6px); opacity: 1 } 21%,100% { transform: translateX(6px); opacity: 0 } }
  @keyframes flash { 0%,19% { opacity: 0; transform: scale(.2) } 22% { opacity: .9; transform: scale(1) } 30%,100% { opacity: 0; transform: scale(1.8) } }
  @keyframes higgs { 0%,21% { opacity: 0 } 24%,32% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes gam { 0%,32% { stroke-dashoffset: 100; opacity: 1 } 46% { stroke-dashoffset: 0; opacity: 1 } 84% { stroke-dashoffset: 0; opacity: 1 } 94%,100% { stroke-dashoffset: 0; opacity: 0 } }
  @keyframes trk { 0%,21% { stroke-dashoffset: 100; opacity: 1 } 36% { stroke-dashoffset: 0; opacity: 1 } 84% { stroke-dashoffset: 0; opacity: 1 } 94%,100% { stroke-dashoffset: 0; opacity: 0 } }
  @keyframes hit { 0%,35% { opacity: 0 } 37%,84% { opacity: 1 } 94%,100% { opacity: 0 } }
  @keyframes jlbl { 0%,34% { opacity: 0 } 40%,84% { opacity: 1 } 94%,100% { opacity: 0 } }
  @keyframes fadeout { 0%,44% { opacity: 0 } 50%,84% { opacity: 1 } 94%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none; }
    #pl, #pr, #flash { opacity: 0; }
    .trk, .gam { stroke-dasharray: none; }
  }
</style>
<rect x="150" y="30" width="300" height="220" rx="18" class="det"/>
<rect x="205" y="72" width="190" height="136" rx="12" class="det"/>
<line x1="0" y1="140" x2="600" y2="140" class="beam"/>
